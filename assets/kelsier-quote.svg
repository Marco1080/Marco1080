<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
  <title id="title">A quote by Kelsier</title>
  <desc id="desc">The trick is to never stop looking. There's always another secret.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11110f"/>
      <stop offset="1" stop-color="#1b1810"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="996" height="226" rx="20" fill="url(#card)" stroke="#3d3420" stroke-width="2"/>
  <path d="M0 30V20Q0 0 20 0h90" fill="none" stroke="#f5c842" stroke-width="4" transform="translate(3 3)"/>
  <text x="54" y="88" fill="#f5c842" font-family="Georgia, serif" font-size="76">“</text>
  <text x="112" y="98" fill="#f5f3eb" font-family="Arial, sans-serif" font-size="25" font-weight="600">The trick is to never stop looking.</text>
  <text x="112" y="137" fill="#f5f3eb" font-family="Arial, sans-serif" font-size="25" font-weight="600">There&apos;s always another secret.</text>
  <line x1="112" y1="167" x2="705" y2="167" stroke="#f5c842" stroke-opacity=".25"/>
  <text x="772" y="177" fill="#f5c842" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">— KELSIER</text>
</svg>
